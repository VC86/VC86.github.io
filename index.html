<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deck Welder</title>
    <style>
        :root {
            --bg-main: #121212;
            --bg-panel: #1a1a1a;
            --bg-btn: #2e2e2e;
            --text-main: #FFFFFF;
            --text-accent: #C8A97E;
            --text-muted: #888888;
            --color-land: #8B5E3C;
            --color-ramp: #4CAF50;
            --color-draw: #2196F3;
            --color-removal: #F44336;
            --color-others: #9E9E9E;
        }

        body {
            margin: 0; font-family: Arial, sans-serif;
            background-color: var(--bg-main); color: var(--text-main);
            display: flex; height: 100vh; overflow: hidden;
        }

        .sidebar {
            width: 320px; background-color: var(--bg-panel); padding: 15px;
            display: flex; flex-direction: column; gap: 8px;
            box-sizing: border-box; border-right: 1px solid #333; overflow-y: auto;
        }

        .sidebar h3 { color: var(--text-accent); margin: 0 0 5px 0; font-size: 14px; text-align: center; }
        
        textarea {
            width: 100%; height: 200px; background-color: #000; color: #FFF;
            border: 1px solid #333; padding: 5px; resize: none; box-sizing: border-box;
            font-family: 'Courier New', Courier, monospace; font-size: 12px;
        }

        button {
            padding: 8px; border: none; cursor: pointer; font-weight: bold; border-radius: 4px;
        }
        button:hover:not(:disabled) { opacity: 0.8; }
        button:disabled { opacity: 0.3; cursor: not-allowed; }

        .btn-primary { background-color: var(--text-accent); color: #121212; }
        .btn-secondary { background-color: var(--bg-btn); color: var(--text-accent); font-size: 11px; }
        
        fieldset { border: 1px solid #333; padding: 10px; margin-top: 5px; border-radius: 4px; }
        legend { font-size: 12px; font-weight: bold; padding: 0 5px; color: #FFF; }
        
        .stat-row { font-family: 'Courier New', Courier, monospace; font-size: 13px; margin: 4px 0; }
        #totalCount { font-family: 'Courier New', Courier, monospace; font-size: 13px; font-weight: bold; color: var(--text-accent); margin-bottom: 8px; }

        .crit-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; font-family: 'Courier New', Courier, monospace; font-size: 12px; color: #AAA; }
        .crit-row input { width: 40px; background: #2e2e2e; color: #FFF; border: 1px solid #555; text-align: center; }

        .main-area { flex-grow: 1; display: flex; flex-direction: column; padding: 15px; box-sizing: border-box; overflow: hidden; }

        .hand-section { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 350px; }
        .hand-container { display: flex; gap: 10px; justify-content: center; align-items: flex-start; height: 260px; }
        .card-slot { width: 150px; text-align: center; display: flex; flex-direction: column; gap: 4px; }
        .card-img { width: 150px; height: 210px; background-color: #2a2a2a; border-radius: 6px; object-fit: cover; }
        .card-name { font-size: 12px; font-weight: bold; color: var(--text-accent); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card-tags { font-size: 10px; font-style: italic; color: var(--text-muted); }

        .action-buttons { display: flex; justify-content: center; gap: 20px; width: 100%; margin-top: 15px; }
        .action-buttons button { padding: 12px 20px; font-size: 14px; width: 160px; }
        .btn-keep { background-color: #4CAF50; color: white; }
        .btn-mull { background-color: #F44336; color: white; }
        .btn-sim { background-color: #7B1FA2; color: white; width: 250px !important; }

        .insights-section {
            flex-grow: 1; border: 1px solid #333; border-radius: 4px; padding: 10px;
            display: flex; flex-direction: column; margin-top: 15px; overflow: hidden;
        }
        .insights-header { color: var(--text-accent); font-weight: bold; font-size: 14px; margin-bottom: 5px; }
        .insights-summary { font-family: 'Courier New', Courier, monospace; font-size: 13px; color: #666; margin-bottom: 10px; }
        
        .insights-grid { display: flex; gap: 10px; overflow-x: auto; flex-grow: 1; padding-bottom: 10px;}
        .insight-col { flex: 1; min-width: 240px; background-color: var(--bg-panel); border-radius: 4px; padding: 8px; display: flex; flex-direction: column; overflow-y: auto; border: 1px solid #333; }
        .col-title { font-family: 'Courier New', Courier, monospace; font-weight: bold; font-size: 12px; margin-bottom: 10px; border-bottom: 1px solid #444; padding-bottom: 4px; }
        .insight-item { font-family: 'Courier New', Courier, monospace; font-size: 11px; margin-bottom: 8px; line-height: 1.3; }
        .insight-item-name { color: #CCC; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    </style>
</head>
<body>

    <div class="sidebar">
        <h3>DECKLIST</h3>
        <textarea id="deckInput" placeholder="1x Sol Ring&#10;Arcane Signet&#10;35x Island"></textarea>
        <button class="btn-primary" id="btnAnalyze">ANALYZE DECK</button>
        <button class="btn-secondary" id="btnExport" disabled>EXPORT STATS (CSV)</button>
        <button class="btn-secondary" id="btnImport" disabled onclick="document.getElementById('fileInput').click()">IMPORT STATS (CSV)</button>
        <input type="file" id="fileInput" accept=".csv" style="display: none;">

        <fieldset>
            <legend>KEEP SCORE BY CAT.</legend>
            <div id="totalCount">Total Cards: 0</div>
            <div id="scoreLabels"></div>
        </fieldset>

        <fieldset>
            <legend>KEEP CRITERIA ⚡</legend>
            <div class="crit-row"><span>Lands</span><span>min <input type="number" id="crit-land-min" value="2"></span><span>max <input type="number" id="crit-land-max" value="5"></span></div>
            <div class="crit-row"><span>Ramp</span><span>min <input type="number" id="crit-ramp-min" value="1"></span><span>max <input type="number" id="crit-ramp-max" value="7"></span></div>
            <div class="crit-row"><span>Draw</span><span>min <input type="number" id="crit-draw-min" value="1"></span><span>max <input type="number" id="crit-draw-max" value="7"></span></div>
        </fieldset>
    </div>

    <div class="main-area">
        <div class="hand-section">
            <div class="hand-container" id="handContainer"></div>
            <div class="action-buttons">
                <button class="btn-keep" id="btnKeep" disabled>KEEP</button>
                <button class="btn-sim" id="btnSim" disabled>⚡ +10</button>
                <button class="btn-mull" id="btnMull" disabled>MULLIGAN</button>
            </div>
        </div>

        <div class="insights-section">
            <div class="insights-header">CARD INSIGHTS</div>
            <div class="insights-summary" id="insightsSummary">Analyze a deck to begin.</div>
            <div class="insights-grid" id="insightsGrid"></div>
        </div>
    </div>

<script>
    const TAGS = {
        land:    { label: "Land",    color: "var(--color-land)",    query: "t:land format:edh" },
        ramp:    { label: "Ramp",    color: "var(--color-ramp)",    query: "otag:ramp format:edh" },
        draw:    { label: "Draw",    color: "var(--color-draw)",    query: "otag:draw format:edh" },
        removal: { label: "Removal", color: "var(--color-removal)", query: "otag:removal format:edh" },
        others:  { label: "Others",  color: "var(--color-others)",  query: null }
    };

    let logs = [];
    let cardDB = {};
    let nameMap = {};
    let deck = [];
    let currentHand = [];
    let categoryCounts = {};
    let totalCardCount = 0;

    const delay = ms => new Promise(res => setTimeout(res, ms));

    function resetState() {
        logs = []; cardDB = {}; nameMap = {}; deck = []; currentHand = []; categoryCounts = {}; totalCardCount = 0;
        for (const t in TAGS) categoryCounts[t] = 0;
        document.getElementById('handContainer').innerHTML = "";
        document.getElementById('insightsGrid').innerHTML = "";
        document.getElementById('totalCount').innerText = "Total Cards: 0";
        initScoreLabels();
    }

    function initScoreLabels() {
        const panel = document.getElementById('scoreLabels');
        panel.innerHTML = "";
        for (const [key, info] of Object.entries(TAGS)) {
            const el = document.createElement('div');
            el.className = 'stat-row'; el.id = `score-${key}`;
            el.style.color = info.color; el.innerText = `${info.label} (0): --`;
            panel.appendChild(el);
        }
    }

    function parseDecklist(text) {
        let tempDeck = [];
        const unique = new Set();
        let count = 0;
        text.trim().split('\n').forEach(line => {
            line = line.trim(); if (!line) return;
            const match = line.match(/^(\d+)[x\s]+(.+)$/);
            const qty = match ? parseInt(match[1]) : 1;
            const name = match ? match[2].trim() : line;
            for (let i = 0; i < qty; i++) tempDeck.push(name);
            count += qty;
            unique.add(name);
        });
        deck = tempDeck;
        totalCardCount = count;
        return Array.from(unique);
    }

    async function analyzeDeck() {
        const text = document.getElementById('deckInput').value;
        if (!text.trim()) return;
        
        resetState();
        const uniqueNames = parseDecklist(text);
        if (!uniqueNames.length) return;

        const btnAnalyze = document.getElementById('btnAnalyze');
        btnAnalyze.disabled = true; btnAnalyze.innerText = "FETCHING...";

        for (let i = 0; i < uniqueNames.length; i += 75) {
            const batch = uniqueNames.slice(i, i + 75);
            try {
                const res = await fetch("https://api.scryfall.com/cards/collection", {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ identifiers: batch.map(n => ({ name: n })) })
                });
                const data = await res.json();
                (data.data || []).forEach(card => {
                    const offName = card.name;
                    const frontName = offName.split(" // ")[0].trim();
                    const inputName = batch.find(n => 
                        n.toLowerCase() === offName.toLowerCase() || 
                        n.toLowerCase() === frontName.toLowerCase() || 
                        offName.toLowerCase().includes(n.toLowerCase())
                    ) || offName;
                    
                    let imgUrl = card.image_uris?.normal || (card.card_faces?.[0]?.image_uris?.normal || "");
                    nameMap[inputName] = offName;
                    if (frontName !== offName && !nameMap[frontName]) nameMap[frontName] = offName;
                    cardDB[offName] = { name: offName, tags: new Set(), img: imgUrl };
                });
            } catch (e) { console.error(e); }
            await delay(100);
        }

        const cardNames = Object.keys(cardDB);
        for (const [tagKey, info] of Object.entries(TAGS)) {
            if (!info.query) continue;
            for (let i = 0; i < cardNames.length; i += 20) {
                const chunk = cardNames.slice(i, i + 20);
                const q = `${info.query} (${chunk.map(n => `!"${n}"`).join(" or ")})`;
                try {
                    const res = await fetch(`https://api.scryfall.com/cards/search?q=${encodeURIComponent(q)}`);
                    if (res.ok) {
                        const data = await res.json();
                        (data.data || []).forEach(card => {
                            if (cardDB[card.name]) cardDB[card.name].tags.add(tagKey);
                        });
                    }
                } catch (e) {}
                await delay(100);
            }
        }

        Object.values(cardDB).forEach(data => { if (data.tags.size === 0) data.tags.add("others"); });
        deck.forEach(deckCard => {
            const offName = nameMap[deckCard] || deckCard;
            (cardDB[offName]?.tags || new Set(["others"])).forEach(t => categoryCounts[t]++);
        });
        
        updateUIScores();
        
        btnAnalyze.disabled = false;
        btnAnalyze.innerText = "ANALYZE DECK";
        
        ['btnExport', 'btnImport', 'btnSim'].forEach(id => {
            document.getElementById(id).disabled = false;
        });
        
        drawHand();
        
        // Move focus away from textarea/input so arrow shortcuts work immediately
        document.body.tabIndex = -1;
        document.body.focus();
    }

    function drawHand() {
        if (!deck.length) return;
        let shuffled = [...deck];
        for (let i = shuffled.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }
        currentHand = shuffled.slice(0, 7);
        const container = document.getElementById('handContainer');
        container.innerHTML = "";
        currentHand.forEach(name => {
            const offName = nameMap[name] || name;
            const data = cardDB[offName] || { img: "", tags: new Set(["others"]) };
            const slot = document.createElement('div'); slot.className = 'card-slot';
            slot.innerHTML = `<img class="card-img" src="${data.img}"><div class="card-name">${name}</div><div class="card-tags">${Array.from(data.tags).map(t => TAGS[t]?.label).join(", ")}</div>`;
            container.appendChild(slot);
        });
        document.getElementById('btnKeep').disabled = false;
        document.getElementById('btnMull').disabled = false;
    }

    function recordDecision(kept) {
        const handTags = new Set(), handCards = [];
        currentHand.forEach(name => {
            const offName = nameMap[name] || name;
            handCards.push(offName);
            (cardDB[offName]?.tags || new Set(["others"])).forEach(t => handTags.add(t));
        });
        logs.push({ cards: handCards, tags: Array.from(handTags), kept: kept ? 1 : 0 });
        updateUIScores();
        drawHand();
    }
    
    function getLiftColor(lift) {
        if (lift < 0.8) return "#F44336";   // red
        if (lift > 1.2) return "#4CAF50";   // green
        return "#FFC107";                   // yellow
    }
    
    function updateUIScores() {
        document.getElementById('totalCount').innerText = `Total Cards: ${totalCardCount}`;
        const catStats = {};
        logs.forEach(e => e.tags.forEach(t => { if(!catStats[t]) catStats[t]=[]; catStats[t].push(e.kept); }));
        for (const [tag, info] of Object.entries(TAGS)) {
            const el = document.getElementById(`score-${tag}`);
            const cnt = categoryCounts[tag] || 0;
            if (catStats[tag]) {
                const sum = catStats[tag].reduce((a,b)=>a+b,0);
                const score = ((sum / catStats[tag].length) * 100).toFixed(1);
                el.innerText = `${info.label} (${cnt}): ${score}%`;
                el.style.color = score >= 50 ? "#4CAF50" : info.color;
            } else { el.innerText = `${info.label} (${cnt}): --`; el.style.color = info.color; }
        }
        
        rebuildInsights();
    }

    function rebuildInsights() {
        const grid = document.getElementById('insightsGrid');
        grid.innerHTML = "";
    
        if (!logs.length) {
            document.getElementById('insightsSummary').innerText = "Analyze a deck to begin.";
            return;
        }
    
        const totalHands = logs.length;
        const overallKept = logs.reduce((s, e) => s + e.kept, 0);
        const overallPct = (overallKept / totalHands) * 100;
    
        document.getElementById('insightsSummary').innerText =
            `${totalHands.toLocaleString()} hands logged · ${overallPct.toFixed(1)}% keep rate`;
    
        const cardStats = {};
    
        logs.forEach(e => {
            // Count each card only once per hand
            const uniqueCards = Array.from(new Set(e.cards));
    
            uniqueCards.forEach(c => {
                if (!cardStats[c]) {
                    cardStats[c] = {
                        seen: 0,
                        keptWith: 0
                    };
                }
    
                cardStats[c].seen++;
                cardStats[c].keptWith += e.kept;
            });
        });
    
        ["land", "ramp", "draw", "removal", "others"].forEach(tagKey => {
            const items = Object.entries(cardStats)
                .filter(([name]) => (cardDB[name]?.tags || new Set(["others"])).has(tagKey))
                .map(([name, s]) => {
                    const seen = s.seen;
                    const keptWith = s.keptWith;
    
                    const notSeen = totalHands - seen;
                    const keptWithout = overallKept - keptWith;
    
                    const pWith = seen > 0
                        ? keptWith / seen
                        : 0;
    
                    const pWithout = notSeen > 0
                        ? keptWithout / notSeen
                        : null;
    
                    let lift;
    
                    if (pWithout === null) {
                        lift = null; // Card appeared in every logged hand
                    } else if (pWithout === 0) {
                        lift = pWith > 0 ? Infinity : 1;
                    } else {
                        lift = pWith / pWithout;
                    }
    
                    return {
                        name,
                        seen,
                        notSeen,
                        keptWith,
                        keptWithout,
                        pWith,
                        pWithout,
                        lift
                    };
                })
                .sort((a, b) => {
                    const liftA = a.lift === Infinity ? Number.MAX_VALUE : (a.lift ?? -1);
                    const liftB = b.lift === Infinity ? Number.MAX_VALUE : (b.lift ?? -1);
                    return liftB - liftA;
                });
    
            if (!items.length) return;
    
            const col = document.createElement('div');
            col.className = 'insight-col';
    
            col.innerHTML = `
                <div class="col-title" style="color:${TAGS[tagKey].color}">
                    ${TAGS[tagKey].label.toUpperCase()}
                </div>
            `;
    
            items.forEach(d => {
                const displayLift =
                    d.lift === null ? "N/A" :
                    d.lift === Infinity ? "∞" :
                    `×${d.lift.toFixed(2)}`;
    
                const barLift =
                    d.lift === null || d.lift === Infinity ? 2 : d.lift;
    
                const bar = "█"
                    .repeat(Math.floor(Math.min(1, barLift / 2) * 16))
                    .padEnd(16, "░");
    
                const liftColor =
                    d.lift === null ? "#888888" :
                    d.lift === Infinity ? "#4CAF50" :
                    getLiftColor(d.lift);
    
                const withoutText =
                    d.pWithout === null
                        ? "without: N/A"
                        : `without: ${(d.pWithout * 100).toFixed(1)}%`;
    
                col.innerHTML += `
                    <div class="insight-item">
                        <div style="color:${liftColor}">
                            ${bar} ${displayLift}
                        </div>
                        <div class="insight-item-name">
                            ${d.name} [n=${d.seen}]
                        </div>
                        <div style="color:#777">
                            with: ${(d.pWith * 100).toFixed(1)}% · ${withoutText}
                        </div>
                    </div>
                `;
            });
    
            grid.appendChild(col);
        });
    }
    
    function startSimulation() {
        const btn = document.getElementById('btnSim');
    
        if (btn.disabled || !deck.length) return;
    
        btn.disabled = true;
        btn.innerText = "SIMULATING...";
    
        const criteria = {
            land: {
                min: parseInt(document.getElementById('crit-land-min').value),
                max: parseInt(document.getElementById('crit-land-max').value)
            },
            ramp: {
                min: parseInt(document.getElementById('crit-ramp-min').value),
                max: parseInt(document.getElementById('crit-ramp-max').value)
            },
            draw: {
                min: parseInt(document.getElementById('crit-draw-min').value),
                max: parseInt(document.getElementById('crit-draw-max').value)
            }
        };
    
        setTimeout(() => {
            try {
                const mappedDeck = deck.map(n => nameMap[n] || n);
    
                for (let i = 0; i < 10; i++) {
                    let d = [...mappedDeck];
    
                    for (let j = d.length - 1; j > 0; j--) {
                        const k = Math.floor(Math.random() * (j + 1));
                        [d[j], d[k]] = [d[k], d[j]];
                    }
    
                    const hand = d.slice(0, 7);
                    const counts = { land: 0, ramp: 0, draw: 0 };
                    const tags = new Set();
    
                    hand.forEach(c => {
                        (cardDB[c]?.tags || new Set(["others"])).forEach(t => {
                            if (counts[t] !== undefined) counts[t]++;
                            tags.add(t);
                        });
                    });
    
                    const keep =
                        counts.land >= criteria.land.min &&
                        counts.land <= criteria.land.max &&
                        counts.ramp >= criteria.ramp.min &&
                        counts.ramp <= criteria.ramp.max &&
                        counts.draw >= criteria.draw.min &&
                        counts.draw <= criteria.draw.max;
    
                    logs.push({
                        cards: hand,
                        tags: Array.from(tags),
                        kept: keep ? 1 : 0
                    });
                }
    
                updateUIScores();
            } catch (err) {
                console.error("Simulation error:", err);
            } finally {
                btn.disabled = false;
                btn.innerText = "⚡ +10";
            }
        }, 50);
    }
    
    function exportToCSV() {
        let csv = 'kept,tags,cards\n' + logs.map(e => `${e.kept},${e.tags.join('|')},${e.cards.join('|')}`).join('\n');
        const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], {type: 'text/csv'})); a.download = 'stats.csv'; a.click();
    }
    
    function importFromCSV(file) {
        const reader = new FileReader();
        reader.onload = e => {
            const lines = e.target.result.trim().split('\n');
            logs = lines.slice(1).map(l => {
                const [k, t, c] = l.split(',');
                return { kept: parseInt(k), tags: t?t.split('|'):[], cards: c?c.split('|'):[] };
            });
            updateUIScores(); if(deck.length) drawHand();
        };
        reader.readAsText(file);
    }

    document.getElementById('btnAnalyze').addEventListener('click', analyzeDeck);
    document.getElementById('btnKeep').addEventListener('click', () => recordDecision(true));
    document.getElementById('btnMull').addEventListener('click', () => recordDecision(false));
    document.getElementById('btnSim').addEventListener('click', startSimulation);
    document.getElementById('btnExport').addEventListener('click', exportToCSV);
    document.getElementById('fileInput').addEventListener('change', e => { if(e.target.files.length) importFromCSV(e.target.files[0]); });
    document.addEventListener('keydown', e => {
        const active = document.activeElement;
        const isTyping =
            active &&
            (
                active.tagName === 'TEXTAREA' ||
                active.tagName === 'INPUT' ||
                active.isContentEditable
            );
    
        // Do not trigger shortcuts while typing in decklist or criteria inputs
        if (isTyping) return;
    
        if (e.key === "ArrowRight") {
            e.preventDefault();
            const btn = document.getElementById('btnMull');
            if (!btn.disabled) recordDecision(true);
        }
    
        if (e.key === "ArrowLeft") {
            e.preventDefault();
            const btn = document.getElementById('btnKeep');
            if (!btn.disabled) recordDecision(false);
        }
    
        if (e.key === "ArrowUp" || e.key === "ArrowDown") {
            e.preventDefault();
            const btn = document.getElementById('btnSim');
            if (!btn.disabled) startSimulation();
        }
    });
    initScoreLabels();
</script>
</body>
</html>
